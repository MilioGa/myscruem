<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cómo leer el gráfico Burndown</title>
  <desc id="d">La línea ideal baja de los puntos comprometidos a cero; la línea real muestra los puntos que quedan cada día. Si la real está arriba, el equipo va atrasado.</desc>
  <rect width="900" height="520" rx="24" fill="#f5f8fc"/>
  <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f3a5f">Gráfico Burndown</text>
  <text x="450" y="80" text-anchor="middle" font-size="15" fill="#5b6577">Puntos de historia que faltan por terminar en cada día del sprint</text>
  <rect x="40" y="100" width="560" height="380" rx="14" fill="#fff" stroke="#dce2ea"/>
  <g stroke="#e8ecf1"><line x1="90" y1="140" x2="570" y2="140"/><line x1="90" y1="215" x2="570" y2="215"/><line x1="90" y1="290" x2="570" y2="290"/><line x1="90" y1="365" x2="570" y2="365"/><line x1="90" y1="440" x2="570" y2="440"/></g>
  <g font-size="12" fill="#788781" text-anchor="end"><text x="80" y="144">20</text><text x="80" y="219">15</text><text x="80" y="294">10</text><text x="80" y="369">5</text><text x="80" y="444">0</text></g>
  <g font-size="12" fill="#788781" text-anchor="middle"><text x="90" y="462">Día 1</text><text x="170" y="462">2</text><text x="250" y="462">3</text><text x="330" y="462">4</text><text x="410" y="462">5</text><text x="490" y="462">6</text><text x="570" y="462">7</text></g>
  <polyline points="90,140 570,440" fill="none" stroke="#9fb0c8" stroke-width="3" stroke-dasharray="10 8"/>
  <polyline points="90,140 170,140 250,215 330,215 410,290" fill="none" stroke="#254e80" stroke-width="4"/>
  <g fill="#254e80"><circle cx="90" cy="140" r="6"/><circle cx="170" cy="140" r="6"/><circle cx="250" cy="215" r="6"/><circle cx="330" cy="215" r="6"/><circle cx="410" cy="290" r="6"/></g>
  <rect x="300" y="232" width="150" height="36" rx="8" fill="#fde8e6"/><text x="375" y="255" text-anchor="middle" font-size="12" fill="#8f2a22">Arriba de la ideal: atraso</text>
  <g font-size="14" fill="#24324a">
    <line x1="630" y1="140" x2="680" y2="140" stroke="#9fb0c8" stroke-width="3" stroke-dasharray="10 8"/><text x="692" y="145" font-weight="bold">Línea ideal</text>
    <text x="630" y="170" font-size="12" fill="#5b6577">Baja de forma constante hasta</text><text x="630" y="186" font-size="12" fill="#5b6577">cero en la fecha de fin.</text>
    <line x1="630" y1="230" x2="680" y2="230" stroke="#254e80" stroke-width="4"/><text x="692" y="235" font-weight="bold">Puntos restantes</text>
    <text x="630" y="260" font-size="12" fill="#5b6577">Baja cuando una historia pasa</text><text x="630" y="276" font-size="12" fill="#5b6577">a Terminado (todas sus tareas).</text>
    <rect x="626" y="320" width="246" height="120" rx="12" fill="#fff" stroke="#c9d4e3"/>
    <text x="644" y="348" font-weight="bold" fill="#1f3a5f">En la Daily</text>
    <text x="644" y="374" font-size="12" fill="#5b6577">• Revisa si la línea real</text><text x="644" y="390" font-size="12" fill="#5b6577">  se separa de la ideal.</text>
    <text x="644" y="414" font-size="12" fill="#5b6577">• Atiende impedimentos y</text><text x="644" y="430" font-size="12" fill="#5b6577">  ajusta el plan del día.</text>
  </g>
</svg>
